name: mobile_template
description: "Minimal Flutter multi-package architecture template"
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.8.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  model:
    path: lib/domain/model
  usecase:
    path: lib/domain/usecase
  dummy_gateway:
    path: lib/gateway/dummy_gateway
  presentation:
    path: lib/presentation

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
