services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: tameshare
      POSTGRES_USER: tameshare
      POSTGRES_PASSWORD: tameshare
    ports:
      - "54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tameshare -d tameshare"]
      interval: 2s
      timeout: 5s
      retries: 15
    volumes:
      - tameshare-postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro

volumes:
  tameshare-postgres-data:
